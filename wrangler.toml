# Cloudflare Pages configuration for MyeCommerce POS
pages_build_output_dir = ".vercel/output/static"

name = "myecommerce-pos"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# D1 compartida por nexus-one (tablas nx_) y el POS (tablas pos_), cuenta bboymak3
d1_databases = [
  { binding = "DB", database_name = "ok_db", database_id = "f4939ecd-22e5-4f7c-b2f5-8861997cb042" }
]

# R2 Storage binding
[[r2_buckets]]
binding = "R2_PHOTOS"
bucket_name = "pos-myecommerce-photos"

[vars]
NODE_ENV = "production"
# Negocio de nexus-one dueno de los datos existentes (tenant_id = 'default')
LEGACY_TENANT_SLUG = "ferreteria-central"

# Secretos (NO van en este archivo). Mientras JWT_SECRET no exista se usa la clave
# anterior; el acceso desde nexus-one (SSO) requiere NEXUS_SSO_SECRET. Configurar con:
#   npx wrangler pages secret put JWT_SECRET --project-name=myecommerce-pos
#   npx wrangler pages secret put NEXUS_SSO_SECRET --project-name=myecommerce-pos
# NEXUS_SSO_SECRET debe ser el mismo valor configurado en el proyecto nexus-one.
